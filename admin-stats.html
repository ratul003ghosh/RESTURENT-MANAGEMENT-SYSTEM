<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Restaurant - Admin Statistics</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .pie-chart-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            padding: 30px;
        }
        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #ff6b6b 0% 35%, 
                #4ecdc4 35% 60%, 
                #45b7d1 60% 85%, 
                #f7d794 85% 100%
            );
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        .color-1 { background: #ff6b6b; }
        .color-2 { background: #4ecdc4; }
        .color-3 { background: #45b7d1; }
        .color-4 { background: #f7d794; }

        .bar-chart-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bar-label {
            width: 80px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #ff6b6b;
            border-radius: 10px;
        }
        .val {
            font-size: 14px;
            color: #666;
            width: 40px;
            text-align: right;
        }
    </style>
</head>
<body class="body">

    <div class="header">
        <div class="site-logo">RMS Admin Portal</div>
        <div class="site-nav">
            <a href="admin.html">Overview</a>
            <a href="admin-stats.html" class="active">Statistics</a>
        </div>
        <div class="header-spacer">
            <span class="profile-avatar" id="adminStatsAvatar" aria-hidden="true">A</span>
            <span id="adminStatsName">ADMIN</span>
            <button type="button" class="btn-outline-sm" id="adminStatsLogout">Log Out</button>
        </div>
    </div>

    <div class="admin-container">
        <div class="dashboard-title">
            <h1>Restaurant Statistics & Analytics</h1>
            <p>Detailed breakdowns of sales, categories, and weekly performance.</p>
        </div>

        <div class="stats-grid">
            <div class="panel-card">
                <div class="panel-header">
                    <h2>Sales by Category</h2>
                </div>
                <div class="pie-chart-container">
                    <div class="pie-chart" id="categoryChart"></div>
                    <div class="chart-legend" id="categoryLegend"></div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-header">
                    <h2>Weekly Revenue Trends</h2>
                </div>
                <div class="bar-chart-container" id="weeklyChart"></div>
            </div>
        </div>
    </div>

    <div class="site-footer">
        <div class="footer-bottom">&copy; 2026 RMS Restaurant System. Admin Dashboard.</div>
    </div>

    <script src="admin-stats.js"></script>
</body>
</html>
