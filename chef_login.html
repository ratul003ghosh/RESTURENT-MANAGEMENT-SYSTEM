<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chef Login — Rustic Fork</title>
  <link rel="stylesheet" href="login.css">
  <style>
    .login-error {
      color: #b91c1c;
      font-size: 13px;
      min-height: 18px;
      margin: 0;
    }
  </style>
</head>
<body class="body">
  <header class="header">
    <div class="site-logo">RMS Restaurant</div>
    <a href="login.html" class="btn-primary">Main Login</a>
  </header>

  <main class="login-container">
    <section class="login-card">
      <div class="login-header">
        <h2>Chef Sign In</h2>
        <p>Sign in with your approved chef account.</p>
      </div>

      <form id="chefLoginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 placeholder="chef@restaurant.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
        <button id="loginButton" class="btn-submit" type="submit">Sign In as Chef</button>
      </form>

      <div class="login-footer">
        <a href="login.html">Back to the main login page</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("chefLoginForm");
    const errorMessage = document.getElementById("loginError");
    const submitButton = document.getElementById("loginButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorMessage.textContent = "";
      submitButton.disabled = true;

      try {
        const response = await fetch("api/chef_auth.php", {
          method: "POST",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "login",
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || "Sign in failed.");
        }
        window.location.href = "saker_dashboard.html";
      } catch (error) {
        errorMessage.textContent = error.message || "Could not connect to the server.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
