<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rustic Fork — Recipe Management</title>
  <link rel="stylesheet" href="recipes.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"></span> Rustic Fork <span class="sub">· KITCHEN</span></div>

  <nav class="nav">
    <a href="dashboard.html"> Dashboard</a>
    <a href="orders.html"> Orders</a>
    <a href="recipes.html" class="active"> Recipes</a>
    <a href="chat.html"> Chat</a>
  </nav>

  <div class="spacer"></div>

  <button id="shiftChip" class="shift"> Off Shift</button>

  <div class="account-wrap">
    <button id="avatarBtn" class="avatar">E</button>
    <div id="accountMenu" class="account-menu">
      <div class="account-name"><b id="menuChef">Elena K.</b><span>Kitchen · Grill Station</span></div>
      <button id="accountDetailsBtn"> Account details</button>
      <button id="switchChefBtn"> Switch chef</button>
      <a href="time.html"> Time &amp; shifts</a>
    </div>
  </div>
</header>

<main>
  <div class="rec-head">
    <div>
      <h1>Recipe Management</h1>
      <div class="tiny"><span id="recipeCount"></span> recipes in your library</div>
    </div>
    <button id="addRecipeBtn" class="btn green">＋ Add Recipe</button>
  </div>
  <input id="recipeSearch" class="search" placeholder="⌕  Search recipes..."/>

  <div id="categories" class="cats"></div>

  <div class="recipes" id="recipeGrid"></div>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="recipes.js"></script>

</body>
</html>
