<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - UIU Restaurant Hub</title>
    <link rel="stylesheet" href="customer.css">
</head>

<body>
    <div class="body1">
        <div class="h1">RMS Restaurant</div>
        <div class="h2">
            <a href="customer-dashboard.html">Dashboard</a> <a href="customer-menu.html">Menu</a> <a
                href="customer-reservation.html">Book Table</a> <a href="customer-orders.html">My Orders</a> <a
                href="customer-bill.html">Bill</a> <a href="customer-chat.html">Chat</a>
            <span style="font-weight:bold; color:#3182CE; margin-right: 15px;">Role: CUSTOMER</span><a href="index.html">Logout</a>
        </div>
    </div>
    <div class="body2">

        <div class="container">
            <div class="auth-wrap">
                <div class="auth-head"><b>Customer Login</b>
                    <div style="font-size:small;margin-top:5px">Sign in to manage your orders and reservations.</div>
                </div>
                <form class="auth-body" id="customerLoginForm" data-role="customer">
                    <div class="form-group"><label for="loginEmail">Email</label><input class="full" id="loginEmail" name="email" type="email"
                        placeholder="customer@example.com" autocomplete="email" required></div><br>
                    <div class="form-group"><label for="loginPassword">Password</label><input class="full" id="loginPassword" name="password" type="password"
                        placeholder="Password" autocomplete="current-password" required></div><br>
                    <button class="btn" type="submit">Login</button>
                    <p class="form-message" id="authMessage" role="status"></p>
                    <div class="auth-switch">Don't have an account? <a href="customer-register.html">Create an
                            account</a></div>
                </form>
            </div>
        </div>

    </div>
    <div class="body3">&copy; 2026 UIU Restaurant Hub</div>
    <script src="api-client.js"></script>
    <script src="customer.js"></script>
</body>

</html>
