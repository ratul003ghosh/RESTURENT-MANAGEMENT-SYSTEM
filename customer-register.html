<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Register - UIU Restaurant Hub</title>
    <link rel="stylesheet" href="customer.css">
</head>

<body>
    <div class="body1">
        <div class="h1">RMS Restaurant</div>
        <div class="h2">
            <a href="customer-dashboard.html">Dashboard</a> <a href="customer-menu.html">Menu</a> <a
                href="customer-reservation.html">Book Table</a> <a href="customer-orders.html">My Orders</a> <a
                href="customer-bill.html">Bill</a> <a href="customer-chat.html">Chat</a>
            <span style="font-weight:bold; color:#3182CE; margin-right: 15px;">Role: CUSTOMER</span><a href="index.html">Logout</a>
        </div>
    </div>
    <div class="body2">

        <div class="container">
            <div class="auth-wrap">
                <div class="auth-head"><b>Create Customer Account</b>
                    <div style="font-size:small;margin-top:5px">Register to book tables and order food ahead.</div>
                </div>
                <form class="auth-body" id="customerRegisterForm">
                    <div class="form-grid">
                        <div class="form-group"><label for="firstName">First Name</label><input class="full" id="firstName" name="first_name" type="text" autocomplete="given-name" required></div>
                        <div class="form-group"><label for="lastName">Last Name</label><input class="full" id="lastName" name="last_name" type="text" autocomplete="family-name" required></div>
                    </div><br>
                    <div class="form-group"><label for="registerEmail">Email</label><input class="full" id="registerEmail" name="email" type="email" autocomplete="email" required></div><br>
                    <div class="form-group"><label for="registerPassword">Password</label><input class="full" id="registerPassword" name="password" type="password" minlength="8" autocomplete="new-password" required></div><br>
                    <button class="btn" type="submit">Create Account</button>
                    <p class="form-message" id="authMessage" role="status"></p>
                    <div class="auth-switch">Already have an account? <a href="customer-login.html">Login</a></div>
                </form>
            </div>
        </div>

    </div>
    <div class="body3">&copy; 2026 UIU Restaurant Hub</div>
    <script src="api-client.js"></script>
    <script src="customer.js"></script>
</body>

</html>
