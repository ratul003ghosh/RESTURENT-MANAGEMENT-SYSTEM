<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Restaurant - Forgot Password</title>
    <link rel="stylesheet" href="forget-password.css">
</head>
<body class="body">

    <div class="header">
        <div class="site-logo">RMS Restaurant</div>
        <div class="site-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="tables.html">Tables</a>
            <a href="reviews.html">Reviews</a>
            <a href="chat.html">Chat</a>
            <a href="feedback.html">Feedback</a>
        </div>
        <a href="signup.html" class="btn-primary btn-sm">Sign Up</a>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Reset Password</h2>
                <p>Enter your email to receive reset instructions.</p>
            </div>

            <form class="login-form" action="#" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="form-actions" style="display: flex; flex-direction: column; gap: 10px;">
                    <a href="login.html" class="btn-submit">Send Reset Link</a>
                </div>
            </form>

            <div class="login-footer">
                <p>Remember your password? <a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

</body>
</html>
