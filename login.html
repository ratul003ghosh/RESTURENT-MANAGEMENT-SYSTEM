<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Restaurant - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="body">

    <div class="header">
        <div class="site-logo">RMS Restaurant</div>
        <div class="site-nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="tables.html">Tables</a>
            <a href="feedback.html">Feedback</a>
        </div>
        <a href="signup.html" class="btn-primary btn-sm">Sign Up</a>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Select your role and enter your credentials to sign in.</p>
            </div>

            <div class="role-selector">
                <div class="role-btn active">Customer</div>
                <div class="role-btn">Waiter</div>
                <div class="role-btn">Chef</div>
                <div class="role-btn">Admin</div>
            </div>

            <form class="login-form" action="#" method="POST">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" placeholder="Enter your email or username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <div class="form-actions">
                    <a href="#" class="btn-submit" id="signInBtn">Sign In</a>
                </div>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="signup.html">Create an Account</a>
            </div>
        </div>
    </div>

    <script>
        // Role selection logic
        const roleBtns = document.querySelectorAll('.role-btn');
        let selectedRole = 'Customer'; // Default

        roleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                roleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRole = btn.textContent.trim();
            });
        });

        // Sign in logic
        const signInBtn = document.getElementById('signInBtn');
        signInBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            if (selectedRole === 'Admin') {
                window.location.href = 'admin.html';
            } else if (selectedRole === 'Customer') {
                window.location.href = 'customer-dashboard.html';
            } else if (selectedRole === 'Chef') {
                window.location.href = 'chef.html';
            } else if (selectedRole === 'Waiter') {
                window.location.href = 'tables.html';
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
