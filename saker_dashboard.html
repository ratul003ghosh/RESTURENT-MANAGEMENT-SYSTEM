<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rustic Fork — Kitchen Dashboard</title>
  <link rel="stylesheet" href="saker_dashboard.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"></span> Rustic Fork <span class="sub">· KITCHEN</span></div>

  <nav class="nav">
    <a href="saker_dashboard.html" class="active"> Dashboard</a>
    <a href="saker_orders.html"> Orders</a>
    <a href="saker_recipes.html"> Recipes</a>
    <a href="saker_chat.html"> Chat</a>
    <a href="chef.html"> KDS</a>
  </nav>

  <div class="spacer"></div>

  <button id="shiftChip" class="shift"> Off Shift</button>

  <div class="account-wrap">
    <button id="avatarBtn" class="avatar">E</button>
    <div id="accountMenu" class="account-menu">
      <div class="account-name"><b id="menuChef">Ratul</b><span>Kitchen · Grill Station</span></div>
      <button id="accountDetailsBtn"> Account details</button>
      <button id="switchChefBtn"> Switch chef</button>
      <a href="saker_time.html"> Time &amp; shifts</a>
    </div>
  </div>
<a href="index.html" style="color:#fff; background:#e53e3e; text-decoration:none; padding:6px 12px; border-radius:4px; font-weight:bold; margin-left:15px;">Logout</a>
</header>

<main>
  <div class="dash-head">
    <div>
      <h1>Order Queue</h1>
      <div class="muted">Manage and track all incoming orders</div>
    </div>

    <div class="dash-tools">
      <label class="dash-search">
        <span>⌕</span>
        <input id="dashSearch" placeholder="Search orders..." autocomplete="off">
      </label>
      <select id="dashCategory" class="dash-select">
        <option value="all">All Categories</option>
        <option value="Main">Main</option>
        <option value="Appetizer">Appetizer</option>
        <option value="Salad">Salad</option>
        <option value="Drinks">Drinks</option>
        <option value="Dessert">Dessert</option>
      </select>
    </div>
  </div>

  <div class="dash-layout">
    <div class="dash-board">

      <section class="dash-column">
        <div class="dash-column-head kitchen">
          <span> <b>Kitchen</b></span>
          <span class="dash-count orange" id="dashKitchenCount">0 orders</span>
        </div>
        <div class="dash-cards" id="dashKitchenCol"></div>
      </section>

      <section class="dash-column">
        <div class="dash-column-head ready">
          <span> <b>Ready</b></span>
          <span class="dash-count green" id="dashReadyCount">0 orders</span>
        </div>
        <div class="dash-cards" id="dashReadyCol"></div>
      </section>

      <section class="dash-side">
        <div class="dash-panel">
          <div class="dash-panel-title"> Quick Actions</div>
          <div class="quick-grid">
            <button class="quick-btn" id="dashNewOrder"><span>New Order</span></button>
            <a class="quick-btn" href="saker_orders.html"><span>View All</span></a>
            <a class="quick-btn" href="saker_recipes.html"><span>Add Recipe</span></a>
            <a class="quick-btn" href="saker_time.html"><span>Time Tracking</span></a>
          </div>
        </div>

        <div class="dash-panel">
          <div class="dash-panel-title"> Recent Activity</div>
          <div id="dashActivity"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="dash-completed">
    <div class="dash-completed-head">
      <span><b>Completed</b> <span class="dash-count" id="dashCompletedCount">0</span></span>
      <a class="btn" href="saker_orders.html"> View All Completed Orders</a>
    </div>
    <div class="dash-completed-grid" id="dashCompletedCol"></div>
  </div>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="dashboard.js"></script>

<script src="chat.js"></script>



</body>
</html>
