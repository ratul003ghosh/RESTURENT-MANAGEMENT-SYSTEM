<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rustic Fork — Order Queue</title>
  <link rel="stylesheet" href="saker_orders.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"></span> Rustic Fork <span class="sub">· KITCHEN</span></div>

  <nav class="nav">
    <a href="dashboard.html"> Dashboard</a>
    <a href="orders.html" class="active"> Orders</a>
    <a href="recipes.html"> Recipes</a>
    <a href="chat.html"> Chat</a>
  </nav>

  <div class="spacer"></div>

  <button id="shiftChip" class="shift"> Off Shift</button>

  <div class="account-wrap">
    <button id="avatarBtn" class="avatar">E</button>
    <div id="accountMenu" class="account-menu">
      <div class="account-name"><b id="menuChef">Elena K.</b><span>Kitchen · Grill Station</span></div>
      <button id="accountDetailsBtn"> Account details</button>
      <button id="switchChefBtn"> Switch chef</button>
      <a href="time.html"> Time &amp; shifts</a>
    </div>
  </div>
</header>

<main>
  <div class="queue-head">
    <div>
      <h1>Order Queue</h1>
      <div class="tiny"><span id="gatedCount">0</span> gated · <span style="color:#20a34a" id="qReady">0</span> ready · <span style="color:#d88412" id="qPrep">0</span> in prep</div>
    </div>
    <button id="releaseSort" class="btn"> Release Time <span>⌄</span></button>
  </div>

  <div class="filters">
    <button class="pill active" data-filter="all">All <span id="allCount">0</span></button>
    <button class="pill" data-filter="locked"> Locked <span id="lockedCount">0</span></button>
    <button class="pill" data-filter="unlocked"> Unlocked <span id="unlockedCount">0</span></button>
    <button class="pill" id="gatingInfo">How gating works</button>
  </div>

  <div id="queue"></div>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="orders.js"></script>

<script src="chat.js"></script>

<script src="auth.js"></script>
</body>
</html>
