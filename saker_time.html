<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rustic Fork — Time & Shifts</title>
  <link rel="stylesheet" href="saker_time.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"></span> Rustic Fork <span class="sub">· KITCHEN</span></div>

  <nav class="nav">
    <a href="dashboard.html"> Dashboard</a>
    <a href="orders.html"> Orders</a>
    <a href="recipes.html"> Recipes</a>
    <a href="chat.html"> Chat</a>
  </nav>

  <div class="spacer"></div>

  <button id="shiftChip" class="shift"> Off Shift</button>

  <div class="account-wrap">
    <button id="avatarBtn" class="avatar">E</button>
    <div id="accountMenu" class="account-menu">
      <div class="account-name"><b id="menuChef">Elena K.</b><span>Kitchen · Grill Station</span></div>
      <button id="accountDetailsBtn"> Account details</button>
      <button id="switchChefBtn"> Switch chef</button>
      <a href="time.html"> Time &amp; shifts</a>
    </div>
  </div>
</header>

<main>
  <div class="time-layout">
    <div class="clockcard">
      <div class="section-title">SHIFT CLOCK</div>
      <div class="clocktime" id="clockTime">00:00:00</div>
      <div class="tiny" id="clockDate"></div>
      <div style="margin-top:9px;color:#f28c18;font-size:10px"> GRILL STATION</div>
      <button id="clockBtn" class="clockbtn"> <br/>Clock In</button>
      <div class="time-actions">
        <button class="btn" data-adjust="-15">−15m</button>
        <button class="btn" data-adjust="15">+15m</button>
        <button class="btn" id="resetShift">Reset</button>
      </div>
      <div class="tiny" style="margin-top:10px">Time is saved automatically on this device.</div>
    </div>

    <div class="week">
      <div class="detail-row"><b>THIS WEEK</b><span style="color:#f28c18"> <span id="weekHours">0h 00m</span> logged</span></div>
      <div class="tiny" style="margin-top:9px">Progress to 40h</div>
      <div class="bar"><i id="weekBar" style="width:0%"></i></div>
    </div>

    <div class="shifts"><div class="section-title">RECENT SHIFTS</div><div id="shiftRows"></div></div>
  </div>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="time.js"></script>

<script src="chat.js"></script>

<script src="auth.js"></script>`n</body>
</html>
