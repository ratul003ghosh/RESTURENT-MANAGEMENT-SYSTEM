<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Restaurant - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body class="body">

    <div class="header">
        <div class="site-logo">RMS Restaurant</div>
        <div class="site-nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="tables.html">Tables</a>
            <a href="chat.html">Chat</a>
            <a href="feedback.html">Feedback</a>
        </div>
        <a href="login.html" class="btn-primary btn-sm">Log In</a>
    </div>

    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-header">
                <h2>Create an Account</h2>
                <p>Join RMS Restaurant to reserve tables and order meals ahead.</p>
            </div>

            <form class="signup-form" action="#" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="+880 1700 000000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>Account Type</label>
                    <select class="form-select">
                        <option value="customer">Customer</option>
                        <option value="waiter">Staff - Waiter</option>
                        <option value="chef">Staff - Chef</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="At least 8 chars" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Repeat password" required>
                    </div>
                </div>

                <div class="terms-option">
                    <label>
                        <input type="checkbox" required> I agree to the <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="login.html" class="btn-submit">Create Account</a>
                </div>
            </form>

            <div class="signup-footer">
                Already registered? <a href="login.html">Sign In Here</a>
            </div>
        </div>
    </div>


</body>
</html>
