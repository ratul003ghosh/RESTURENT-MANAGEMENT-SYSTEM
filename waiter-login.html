<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiter Login - RMS Restaurant</title>
    <link rel="stylesheet" href="customer.css">
    <link rel="stylesheet" href="waiter.css">
</head>

<body>
    <div class="body1">
        <div class="h1">RMS Restaurant</div>
        <div class="h2">
            <a href="index.html">Home</a>
        </div>
    </div>
    <div class="body2">

        <div class="container">
            <div class="auth-wrap">
                <div class="auth-head"><b>Waiter Login</b>
                    <div style="font-size:small;margin-top:5px">Sign in to start your shift.</div>
                </div>
                <div class="auth-body">
                    <div class="form-group"><label>Staff Email</label><input class="full" type="email"
                            placeholder="waiter@rms.com"></div><br>
                    <div class="form-group"><label>Password</label><input class="full" type="password"
                            placeholder="Password"></div><br>
                    <a class="btn full" href="waiter-dashboard.html" style="text-align:center;display:block">Login</a>
                    <div class="auth-switch">Not staff? <a href="customer-login.html">Customer login</a></div>
                </div>
            </div>
        </div>

    </div>
    <div class="body3">&copy; 2026 UIU Restaurant Hub</div>
</body>

</html>
